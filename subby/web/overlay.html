<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>rksubby felirat</title>
<style>
  /* OBS böngészőforrás (1920x1080, átlátszó háttér). A kinézetet a program küldi (/events). */
  :root {
    --font: Arial, sans-serif; --size: 32px; --color: #ffff00; --en: #dddddd;
    --maxw: 1300px; --bottom: 40px; --box: transparent;
  }
  html, body { background: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; height: 100%; }
  #sub {
    position: absolute; left: 0; right: 0; bottom: var(--bottom);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-family: var(--font); text-align: center;
  }
  .line, .partial {
    max-width: var(--maxw); box-sizing: border-box; padding: 2px 18px; border-radius: 10px;
    text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
  }
  .line { background: var(--box); animation: in .16s ease-out; }
  .hu { color: var(--color); font-size: var(--size); font-weight: bold; line-height: 1.25; }
  .en { color: var(--en); font-size: calc(var(--size) * .62); font-style: italic; line-height: 1.3; }
  .partial { color: #bbbbbb; font-size: calc(var(--size) * .7); font-style: italic; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div id="sub"></div>
  <script src="/static/subs.js"></script>
  <script>RkSubs.mount(document.getElementById('sub'), { demo: /[?&]demo=1/.test(location.search) });</script>
</body>
</html>
